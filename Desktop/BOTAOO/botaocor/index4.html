<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar Cor de Fundo</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 50px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <input type="text" id="inputCor" placeholder="Digite uma cor e pressione Enter">

    <script>
        document.getElementById("inputCor").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                const corDigitada = this.value;
                document.body.style.backgroundColor = corDigitada;
            }
        });
    </script>

</body>
</html>
