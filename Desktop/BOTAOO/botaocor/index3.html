<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Simples</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 50px;
        }
        .contador {
            font-size: 24px;
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>

    <button onclick="diminuir()">-</button>
    <span class="contador" id="numero">0</span>
    <button onclick="aumentar()">+</button>

    <script>
        let contador = 0;

        function aumentar() {
            contador++;
            document.getElementById("numero").textContent = contador;
        }

        function diminuir() {
            contador--;
            document.getElementById("numero").textContent = contador;
        }
    </script>

</body>
</html>
